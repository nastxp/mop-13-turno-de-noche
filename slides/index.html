<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOP-13 · Presentación</title>
    <meta name="description" content="Presentación del TFM MOP-13 · Turno de noche en el espacio, hecha con HyperFrames." />
    <!-- Reproductor y mazo de HyperFrames (copiados de hyperframes@0.9.86) -->
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="vendor/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05080a; }
    </style>
  </head>
  <body>
    <!--
      Flechas izquierda/derecha o espacio para avanzar · P abre la vista de público (modo presentador).
      La isla JSON de abajo es una COPIA de la que hay en composition/index.html:
      <hyperframes-slideshow> la lee de su propio contenido. Si cambias las slides, actualiza las dos.
    -->
    <hyperframes-slideshow tabindex="0" style="display: block; position: relative; width: 100vw; height: 100vh">
      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <script type="application/hyperframes-slideshow+json">
      {
        "slides": [
          { "sceneId": "cover", "notes": "Presentarse. MOP-13 es mi TFM del Máster de Desarrollo con IA: un juego web cooperativo que se juega en el navegador, sin instalar nada." },
          { "sceneId": "idea", "notes": "La idea: el juego de gestión de crisis visto desde abajo. No eres el capitán: eres el conserje del turno de noche y tu trabajo es que todo esté limpio a las 06:00 mientras la nave se cae a pedazos." },
          { "sceneId": "bucle", "fragments": [12.3, 12.6, 12.9], "notes": "Cada turno sigue el mismo bucle. Pulsar flecha derecha para ir mostrando cada paso." },
          { "sceneId": "nave", "notes": "La nave es una simulación: cada tripulante tiene necesidades (hambre, fatiga, vejiga, trabajo, vida social) y decide qué hacer. Ensucian, rompen cosas y provocan incidentes." },
          { "sceneId": "herramientas", "notes": "Ocho herramientas con teclas 1 a 8. Cada una tiene su carga, su desgaste y sus pros y contras: la fregona deja el suelo mojado y la tripulación resbala." },
          { "sceneId": "modos", "notes": "Modos de juego. La historia empieza con un turno de prueba y sigue con nueve noches con misión; tres de ellas acaban con un jefe." },
          { "sceneId": "progresion", "notes": "La progresión se guarda en el navegador: créditos, experiencia, mejoras, ropa y logros." },
          { "sceneId": "coop", "notes": "Lo más complejo del proyecto: cooperativo online de hasta cuatro jugadores, con chat de voz." },
          { "sceneId": "arquitectura", "fragments": [48.3], "notes": "El anfitrión es la autoridad: simula la nave entera. El servidor solo reenvía mensajes. Flecha derecha para mostrar la voz por WebRTC." },
          { "sceneId": "stack", "notes": "Stack tecnológico. Todo el arte se dibuja por código y el sonido se sintetiza con Web Audio." },
          { "sceneId": "servidor", "notes": "El servidor no tiene ninguna dependencia de npm: solo módulos de Node." },
          { "sceneId": "despliegue", "notes": "Desplegado en Hostinger como aplicación Node.js. Enseñar /healthz en directo." },
          { "sceneId": "gracias", "notes": "Cerrar invitando a jugar. Abrir el enlace y crear una sala en directo si da tiempo." }
        ]
      }
    </script>
    </hyperframes-slideshow>
    <script>
      // el foco en el mazo hace que las flechas funcionen nada más abrir la página
      window.addEventListener("load", function () {
        var deck = document.querySelector("hyperframes-slideshow");
        if (deck) deck.focus();
      });
    </script>
  </body>
</html>
